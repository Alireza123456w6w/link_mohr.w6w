<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171512">
<meta name="description" content="مُهر — ابزار امن برای ایجاد و اشتراک لینک‌های محرمانه با رمزنگاری AES-256">
<title>مُهر — لینک محرمانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #171512;
    --ink-2: #211d18;
    --ink-3: #2a251f;
    --card: #2a251f;
    --parchment: #ece3ce;
    --parchment-dim: #c7bba0;
    --wax: #8c2a34;
    --wax-light: #ad3a44;
    --brass: #c9a15b;
    --brass-dim: #8f7746;
    --muted: #9c9184;
    --danger: #c96b3d;
    --ok: #7f9e6d;
    --radius: 10px;
    --transition: all 0.2s ease;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(201,161,91,0.08), transparent 60%),
      radial-gradient(ellipse at 90% 110%, rgba(140,42,52,0.10), transparent 55%);
    font-family: 'Vazirmatn', sans-serif;
    color: var(--parchment);
    scroll-behavior: smooth;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; direction: ltr; unicode-bidi: isolate; }

  .wrap { width: 100%; max-width: 480px; }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--brass);
    font-weight: 600;
    margin: 0 0 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }
  .eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(to left, var(--brass-dim), transparent);
    opacity: 0.5;
  }

  h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 800;
    margin: 0 0 24px;
    color: var(--parchment);
    line-height: 1.3;
    letter-spacing: -0.5px;
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(201,161,91,0.28);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35), 0 0 1px rgba(201,161,91,0.1) inset;
    position: relative;
    overflow: hidden;
    transition: var(--transition);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--parchment-dim);
    margin: 0 0 8px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  input[type="url"], input[type="text"], input[type="password"], input[type="number"] {
    width: 100%;
    background: var(--ink-2);
    border: 1px solid rgba(201,161,91,0.22);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--parchment);
    font-family: inherit;
    font-size: 14.5px;
    outline: none;
    transition: var(--transition);
  }
  input::placeholder { color: var(--muted); }
  input:focus {
    border-color: var(--brass);
    box-shadow: 0 0 0 3px rgba(201,161,91,0.15);
    background: var(--ink-3);
  }
  input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .field { margin-bottom: 18px; }

  .toggle-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 0;
    border-top: 1px solid rgba(201,161,91,0.12);
    transition: var(--transition);
  }
  .toggle-row:hover { background: rgba(201,161,91,0.03); padding-left: 4px; }
  .toggle-row:first-of-type { border-top: 1px solid rgba(201,161,91,0.12); margin-top: 8px; }
  .toggle-row input[type="checkbox"] {
    accent-color: var(--wax);
    width: 18px; height: 18px;
    margin-top: 3px;
    flex-shrink: 0;
    cursor: pointer;
    transition: var(--transition);
  }
  .toggle-row input[type="checkbox"]:hover { transform: scale(1.1); }
  .toggle-row .t-label { font-size: 15px; font-weight: 600; color: var(--parchment); cursor: pointer; }
  .toggle-row .t-desc { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .toggle-row label.t-main { flex: 1; margin: 0; cursor: pointer; }

  #passwordField { margin-top: 12px; margin-right: 28px; display: none; }
  #passwordField.show { display: block; animation: slideDown 0.2s ease; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  button.seal-btn {
    width: 100%;
    margin-top: 22px;
    background: linear-gradient(180deg, var(--wax-light), var(--wax));
    border: 1px solid rgba(0,0,0,0.25);
    color: var(--parchment);
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    padding: 14px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 10px 20px rgba(140,42,52,0.25);
    transition: var(--transition);
    letter-spacing: 0.01em;
    text-transform: none;
  }
  button.seal-btn:hover { 
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 12px 24px rgba(140,42,52,0.3);
  }
  button.seal-btn:active, button.seal-btn.pressed {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 4px 10px rgba(140,42,52,0.2);
  }
  button.seal-btn:disabled { 
    opacity: 0.6; 
    cursor: not-allowed;
    transform: none;
  }
  button.seal-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

  button.ghost-btn {
    background: transparent;
    border: 1px solid rgba(201,161,91,0.4);
    color: var(--brass);
    font-family: inherit;
    font-weight: 600;
    font-size: 13.5px;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: var(--transition);
    letter-spacing: 0.02em;
  }
  button.ghost-btn:hover { 
    background: rgba(201,161,91,0.1);
    border-color: var(--brass);
  }
  button.ghost-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .error-msg {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    display: none;
    line-height: 1.6;
    padding: 10px 12px;
    background: rgba(201,107,61,0.1);
    border-radius: 6px;
    border-left: 3px solid var(--danger);
  }
  .error-msg.show { display: block; animation: slideDown 0.2s ease; }

  .success-msg {
    color: var(--ok);
    font-size: 13px;
    margin-top: 12px;
    display: none;
    line-height: 1.6;
    padding: 10px 12px;
    background: rgba(127,158,109,0.1);
    border-radius: 6px;
    border-left: 3px solid var(--ok);
  }
  .success-msg.show { display: block; animation: slideDown 0.2s ease; }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 18px;
    line-height: 1.8;
    border-top: 1px solid rgba(201,161,91,0.12);
    padding-top: 14px;
  }

  /* result / ticket */
  .ticket {
    background: var(--ink-2);
    border: 1px dashed rgba(201,161,91,0.45);
    border-radius: 8px;
    padding: 16px;
    margin: 4px 0 18px;
    transition: var(--transition);
  }
  .ticket:hover { border-color: rgba(201,161,91,0.65); }
  .ticket .ticket-label { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; letter-spacing: .04em; text-transform: uppercase; }
  .ticket .ticket-link {
    font-size: 13.5px;
    color: var(--brass);
    word-break: break-all;
    font-weight: 500;
  }

  .copy-row { display: flex; gap: 10px; }
  .copy-row button { flex-shrink: 0; }

  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .badge {
    font-size: 11.5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(201,161,91,0.35);
    color: var(--brass-dim);
    background: rgba(201,161,91,0.08);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* seal emblem for reveal view */
  .seal-emblem {
    width: 96px; height: 96px;
    margin: 8px auto 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, var(--wax-light), var(--wax) 70%);
    border: 2px solid rgba(201,161,91,0.5);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 28px rgba(140,42,52,0.35), inset 0 -8px 12px rgba(0,0,0,0.3);
    transition: var(--transition);
    position: relative;
  }
  .seal-emblem::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: radial-gradient(circle, transparent 45%, rgba(201,161,91,0.1) 100%);
  }
  .seal-emblem.cracked { 
    animation: crack 0.6s ease forwards;
  }
  @keyframes crack {
    0% { transform: scale(1) rotate(0deg); opacity: 1; }
    50% { transform: scale(1.1) rotate(3deg); opacity: 1; }
    100% { transform: scale(1.15) rotate(8deg); opacity: 0; }
  }
  .seal-emblem svg { width: 40px; height: 40px; opacity: 0.95; position: relative; z-index: 1; }

  .center { text-align: center; }

  .reveal-url {
    background: var(--ink-2);
    border: 1px solid rgba(127,158,109,0.4);
    border-radius: 8px;
    padding: 16px;
    word-break: break-all;
    font-size: 14px;
    margin-bottom: 16px;
    transition: var(--transition);
  }
  .reveal-url:hover { border-color: rgba(127,158,109,0.6); }
  .reveal-url a { color: var(--ok); text-decoration: none; font-weight: 600; }
  .reveal-url a:hover { text-decoration: underline; }

  .status-note { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.7; }

  .loader {
    width: 24px; height: 24px;
    border: 2.5px solid rgba(201,161,91,0.25);
    border-top-color: var(--brass);
    border-radius: 50%;
    margin: 24px auto;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Expiration Time Display */
  .expiry-badge {
    display: inline-block;
    font-size: 11px;
    padding: 4px 8px;
    background: rgba(201,107,61,0.15);
    border: 1px solid rgba(201,107,61,0.4);
    border-radius: 4px;
    color: var(--danger);
    margin-top: 8px;
  }

  /* Stats Display */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid rgba(201,161,91,0.12);
  }
  .stat-item {
    flex: 1;
    text-align: center;
    padding: 8px;
    background: rgba(201,161,91,0.06);
    border-radius: 6px;
  }
  .stat-label { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  .stat-value { font-size: 16px; font-weight: 700; color: var(--parchment); margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 480px) {
    .wrap { max-width: 100%; }
    .card { padding: 20px 16px; }
    h1 { font-size: 24px; margin-bottom: 18px; }
    .badge-row { gap: 6px; }
    .stats-row { gap: 8px; }
    body { padding: 20px 12px; }
  }

  @media (max-width: 360px) {
    .card { padding: 16px 12px; }
    h1 { font-size: 20px; }
    button.seal-btn, button.ghost-btn { font-size: 14px; padding: 12px; }
  }

  .top-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  .top-row .eyebrow { flex: 1; margin: 0; }

  button.lang-btn {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid rgba(201,161,91,0.4);
    color: var(--brass);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: var(--transition);
    text-transform: uppercase;
  }
  button.lang-btn:hover { 
    background: rgba(201,161,91,0.12);
    border-color: var(--brass);
  }
  button.lang-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .credits {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid rgba(201,161,91,0.15);
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.85;
  }
  .credits-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--brass-dim);
    margin-bottom: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .credits-row { margin-bottom: 8px; }
  .credits-row .credits-name {
    color: var(--parchment-dim);
    font-weight: 600;
    margin-inline-end: 10px;
  }
  .credits-row a {
    color: var(--brass);
    text-decoration: none;
    margin-inline-end: 12px;
    display: inline-block;
    transition: var(--transition);
  }
  .credits-row a:hover { text-decoration: underline; color: var(--brass); }
  .credits-desc { color: var(--muted); }

  /* Theme Selector */
  .theme-selector {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(201,161,91,0.12);
  }
  .theme-btn {
    flex: 1;
    padding: 8px;
    background: rgba(201,161,91,0.08);
    border: 1px solid rgba(201,161,91,0.2);
    border-radius: 6px;
    color: var(--brass-dim);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: var(--transition);
  }
  .theme-btn:hover, .theme-btn.active { 
    background: rgba(201,161,91,0.15);
    border-color: var(--brass);
    color: var(--brass);
  }
</style>
</head>

    creditsTitle: 'Creators & Contact',
    creditsClaudeDesc: 'AI assistant that helped design and build this tool',

    themeLight: 'Light',
    themeDark: 'Dark',
    views: 'Views',
    created: 'Created'
  }
};

function t(key) { return STRINGS[LANG][key]; }

function applyShellLang() {
  const s = STRINGS[LANG];
  document.documentElement.lang = LANG;
  document.documentElement.dir = s.dir;
  document.getElementById('eyebrowText').textContent = s.eyebrow;
  document.getElementById('langToggle').textContent = s.langBtn;
  document.getElementById('creditsTitle').textContent = s.creditsTitle;
  if (document.getElementById('creditsClaudeDesc')) {
    document.getElementById('creditsClaudeDesc').textContent = s.creditsClaudeDesc;
  }
  if (currentView.name === 'create') renderCreateForm(currentView.prefill);
  else if (currentView.name === 'result') renderResult(currentView.id, currentView.data);
}

let currentView = { name: 'create' };

// Core logic
function genId(len = 9) {
  let id = '';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  for (let i = 0; i < len; i++) id += ALPHABET[arr[i] % ALPHABET.length];
  return id;
}

function normalizeUrl(u) {
  u = u.trim();
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

function hasCrypto() {
  return typeof crypto !== 'undefined'
    && crypto.subtle
    && typeof crypto.subtle.encrypt === 'function';
}

function bytesToBase64(bytes) {
  let bin = '';
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin);
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, saltBytes) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 150000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptUrl(url, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ciphertextBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(url));
  return {
    salt: bytesToBase64(salt),
    iv: bytesToBase64(iv),
    ciphertext: bytesToBase64(new Uint8Array(ciphertextBuf))
  };
}

async function decryptUrl(encPayload, password) {
  const salt = base64ToBytes(encPayload.salt);
  const iv = base64ToBytes(encPayload.iv);
  const ciphertext = base64ToBytes(encPayload.ciphertext);
  const key = await deriveKey(password, salt);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
  return new TextDecoder().decode(plainBuf);
}

function isProtected(data) {
  return !!(data.encrypted || data.password);
}

function hasCloudStorage() {
  return typeof window.storage !== 'undefined'
    && window.storage
    && typeof window.storage.set === 'function';
}

function hasStableOrigin() {
  return location.protocol === 'http:'
    || location.protocol === 'https:'
    || location.protocol === 'file:';
}

function isClaudeSandbox() {
  return hasCloudStorage() && !hasStableOrigin();
}

async function saveSecret(id, data) {
  try {
    if (hasCloudStorage()) {
      return await window.storage.set(PREFIX + id, JSON.stringify(data), true);
    }
    localStorage.setItem(PREFIX + id, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error(e);
    return null;
  }
}

async function loadSecret(id) {
  try {
    if (hasCloudStorage()) {
      const res = await window.storage.get(PREFIX + id, true);
      return res ? JSON.parse(res.value) : null;
    }
    const raw = localStorage.getItem(PREFIX + id);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

async function removeSecret(id) {
  try {
    if (hasCloudStorage()) {
      await window.storage.delete(PREFIX + id, true);
    } else {
      localStorage.removeItem(PREFIX + id);
    }
  } catch (e) {}
}

function shareLink(id) {
  return location.origin + location.pathname + '#' + id;
}

function isExpired(data) {
  if (!data.expiryTime || data.expiryTime === 0) return false;
  return Date.now() > data.expiryTime;
}

const app = document.getElementById('app');
const titleEl = document.getElementById('pageTitle');

function renderCreateForm(prefill) {
  currentView = { name: 'create', prefill: prefill || null };
  titleEl.textContent = t('titleCreate');

  app.innerHTML = `
    <div class="field">
      <label for="destUrl">${t('destLabel')}</label>
      <input type="url" id="destUrl" placeholder="${t('destPlaceholder')}" autocomplete="off">
    </div>

    <div class="toggle-row">
      <input type="checkbox" id="oneTimeChk">
      <label class="t-main" for="oneTimeChk">
        <div class="t-label">${t('oneTimeLabel')}</div>
        <div class="t-desc">${t('oneTimeDesc')}</div>
      </label>
    </div>

    <div class="toggle-row">
      <input type="checkbox" id="pwChk">
      <label class="t-main" for="pwChk">
        <div class="t-label">${t('pwLabel')}</div>
        <div class="t-desc">${t('pwDesc')}</div>
      </label>
    </div>

    <div id="passwordField">
      <input type="text" id="pwInput" placeholder="${t('pwPlaceholder')}">
    </div>

    <div class="toggle-row">
      <input type="checkbox" id="expiryChk">
      <label class="t-main" for="expiryChk">
        <div class="t-label">${t('expiryLabel')}</div>
        <div class="t-desc">${t('expiryDesc')}</div>
      </label>
    </div>

    <div id="expiryField" style="display:none;">
      <input type="number" id="expiryInput" placeholder="${t('expiryPlaceholder')}" value="24" min="0">
    </div>

    <button class="seal-btn" id="createBtn">${t('sealBtn')}</button>
    <div class="error-msg" id="createError"></div>

    <div class="hint">${t('formHint')}</div>

    <div style="margin-top:16px; padding-top:14px; border-top:1px solid rgba(201,161,91,0.12);">
      <button type="button" class="ghost-btn" id="haveCodeBtn" style="width:100%;">${t('haveCodeBtn')}</button>
      <div id="haveCodeBox" style="display:none; margin-top:10px;">
        <input type="text" id="haveCodeInput" class="mono" placeholder="${t('haveCodePlaceholder')}" autocomplete="off" style="width:100%; box-sizing:border-box;">
        <button type="button" class="seal-btn" id="haveCodeSubmit" style="margin-top:10px;">${t('haveCodeSubmit')}</button>
        <div class="error-msg" id="haveCodeError"></div>
      </div>
    </div>
  `;

  if (prefill) {
    document.getElementById('destUrl').value = prefill.url || '';
    document.getElementById('oneTimeChk').checked = !!prefill.oneTime;
    document.getElementById('pwChk').checked = !!prefill.pwChk;
    if (prefill.pwChk) document.getElementById('passwordField').classList.add('show');
    document.getElementById('pwInput').value = prefill.pwVal || '';
  }

  const pwChk = document.getElementById('pwChk');
  const pwField = document.getElementById('passwordField');
  pwChk.addEventListener('change', () => {
    pwField.classList.toggle('show', pwChk.checked);
    if (pwChk.checked) setTimeout(() => document.getElementById('pwInput').focus(), 0);
  });

  const expiryChk = document.getElementById('expiryChk');
  const expiryField = document.getElementById('expiryField');
  expiryChk.addEventListener('change', () => {
    expiryField.style.display = expiryChk.checked ? 'block' : 'none';
    if (expiryChk.checked) setTimeout(() => document.getElementById('expiryInput').focus(), 0);
  });

  document.getElementById('createBtn').addEventListener('click', onCreate);
  document.getElementById('destUrl').addEventListener('keydown', e => {
    if (e.key === 'Enter') onCreate();
  });

  const haveCodeBtn = document.getElementById('haveCodeBtn');
  const haveCodeBox = document.getElementById('haveCodeBox');
  haveCodeBtn.addEventListener('click', () => {
    const showing = haveCodeBox.style.display !== 'none';
    haveCodeBox.style.display = showing ? 'none' : 'block';
    if (!showing) document.getElementById('haveCodeInput').focus();
  });

  const submitCode = () => {
    const val = document.getElementById('haveCodeInput').value.trim();
    const err = document.getElementById('haveCodeError');
    if (!val) {
      err.textContent = t('haveCodeEmpty');
      err.classList.add('show');
      return;
    }
    renderRevealView(val);
  };
  document.getElementById('haveCodeSubmit').addEventListener('click', submitCode);
  document.getElementById('haveCodeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitCode();
  });
}

async function onCreate() {
  const btn = document.getElementById('createBtn');
  const errEl = document.getElementById('createError');
  errEl.classList.remove('show');

  const urlRaw = document.getElementById('destUrl').value;
  const oneTime = document.getElementById('oneTimeChk').checked;
  const pwChk = document.getElementById('pwChk').checked;
  const pwVal = document.getElementById('pwInput').value.trim();
  const expiryChk = document.getElementById('expiryChk').checked;
  const expiryHours = parseInt(document.getElementById('expiryInput').value) || 0;

  if (!urlRaw.trim()) {
    errEl.textContent = t('errNoUrl');
    errEl.classList.add('show');
    return;
  }
  if (pwChk && !pwVal) {
    errEl.textContent = t('errNoPw');
    errEl.classList.add('show');
    return;
  }
  if (!oneTime && !pwChk && !expiryChk) {
    errEl.textContent = t('errNoOption');
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.classList.add('pressed');
  btn.textContent = t('sealing');

  try {
    const id = genId();
    const destUrl = normalizeUrl(urlRaw);
    const data = {
      password: null,
      encrypted: false,
      enc: null,
      url: null,
      oneTime: oneTime,
      expiryTime: expiryChk && expiryHours > 0 ? Date.now() + (expiryHours * 3600000) : 0,
      createdAt: Date.now(),
      accessCount: 0
    };

    if (pwChk) {
      if (hasCrypto()) {
        try {
          data.enc = await encryptUrl(destUrl, pwVal);
          data.encrypted = true;
        } catch (e) {
          btn.classList.remove('pressed');
          btn.disabled = false;
          btn.textContent = t('sealBtn');
          errEl.textContent = 'رمزنگاری ناموفق';
          errEl.classList.add('show');
          return;
        }
      } else {
        data.password = pwVal;
        data.url = destUrl;
      }
    } else {
      data.url = destUrl;
    }

    const result = await saveSecret(id, data);
    btn.classList.remove('pressed');

    if (!result) {
      btn.disabled = false;
      btn.textContent = t('sealBtn');
      errEl.textContent = 'خطا در ذخیره‌سازی';
      errEl.classList.add('show');
      return;
    }

    renderResult(id, data);
  } catch (e) {
    console.error(e);
    btn.classList.remove('pressed');
    btn.disabled = false;
    btn.textContent = t('sealBtn');
    errEl.textContent = 'خطای پیش‌بینی‌نشده';
    errEl.classList.add('show');
  }
}

function renderResult(id, data) {
  currentView = { name: 'result', id, data };
  titleEl.textContent = t('titleResult');
  const link = shareLink(id);
  const badges = [];
  if (data.oneTime) badges.push(t('badgeOneTime'));
  if (isProtected(data)) badges.push(t('badgePassword'));
  if (data.expiryTime) badges.push(t('badgeExpiry'));

  app.innerHTML = `
    <div class="badge-row">
      ${badges.map(b => `<span class="badge">${b}</span>`).join('')}
    </div>
    <div class="ticket">
      <div class="ticket-label">${t('linkLabel')}</div>
      <div class="ticket-link mono" id="linkText">${link}</div>
    </div>
    <div class="copy-row">
      <button class="seal-btn" id="copyBtn" style="flex:1">${t('copyLink')}</button>
    </div>
    <div style="margin-top:14px; text-align:center;">
      <button class="ghost-btn" id="newLinkBtn">${t('newLinkBtn')}</button>
    </div>
  `;

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const btn = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(link);
      btn.textContent = t('copied');
      setTimeout(() => { btn.textContent = t('copyLink'); }, 1800);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = link;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.textContent = t('copied');
      setTimeout(() => { btn.textContent = t('copyLink'); }, 1800);
    }
  });

  document.getElementById('newLinkBtn').addEventListener('click', () => {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    renderCreateForm();
  });
}

async function renderRevealView(id) {
  currentView = { name: 'revealLoading', id };
  titleEl.textContent = t('titleReveal');
  app.innerHTML = `<div class="loader"></div>`;

  const data = await loadSecret(id);

  if (!data || isExpired(data)) {
    app.innerHTML = `
      <div class="center">
        <p style="font-weight:700; margin-bottom:6px; font-size:18px;">${t('notFoundTitle')}</p>
        <p class="status-note">${t('notFoundDesc')}</p>
        <div style="margin-top:18px;">
          <button class="ghost-btn" id="goCreate">${t('createNewBtn')}</button>
        </div>
      </div>
    `;
    document.getElementById('goCreate').addEventListener('click', () => {
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      renderCreateForm();
    });
    return;
  }

  if (isProtected(data)) {
    renderPasswordGate(id, data);
  } else {
    renderOpenPrompt(id, data);
  }
}

function renderOpenPrompt(id, data) {
  currentView = { name: 'openPrompt', id, data };
  titleEl.textContent = t('titleReveal');
  app.innerHTML = `
    <div class="center">
      <p style="font-weight:700; margin-bottom:6px; font-size:18px;">${t('openPromptTitle')}</p>
      <p class="status-note" style="margin-bottom:16px;">${data.oneTime ? t('openPromptOneTime') : ''}</p>
      <button class="seal-btn" id="breakBtn">${t('breakBtn')}</button>
    </div>
  `;
  document.getElementById('breakBtn').addEventListener('click', () => openSecret(id, data));
}

function renderPasswordGate(id, data) {
  currentView = { name: 'pwGate', id, data };
  titleEl.textContent = t('titleReveal');
  app.innerHTML = `
    <div class="center">
      <p style="font-weight:700; margin-bottom:4px; font-size:18px;">${t('pwGateTitle')}</p>
      <p class="status-note" style="margin-bottom:14px;">${t('pwGateDesc')}</p>
    </div>
    <div class="field" style="text-align:right">
      <input type="password" id="pwGateInput" placeholder="${t('pwGatePlaceholder')}" style="width:100%;">
    </div>
    <button class="seal-btn" id="pwGateBtn">${t('unlockBtn')}</button>
    <div class="error-msg" id="pwGateError"></div>
  `;

  const tryUnlock = async () => {
    const pw = document.getElementById('pwGateInput').value;
    const err = document.getElementById('pwGateError');
    err.classList.remove('show');

    try {
      if (data.encrypted) {
        const url = await decryptUrl(data.enc, pw);
        data.url = url;
      } else {
        if (data.password !== pw) throw new Error('wrong');
      }
      openSecret(id, data);
    } catch (e) {
      err.textContent = t('pwWrong');
      err.classList.add('show');
    }
  };

  document.getElementById('pwGateBtn').addEventListener('click', tryUnlock);
  document.getElementById('pwGateInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlock();
  });
  setTimeout(() => document.getElementById('pwGateInput').focus(), 0);
}

async function openSecret(id, data) {
  data.accessCount = (data.accessCount || 0) + 1;
  
  if (data.oneTime) {
    await removeSecret(id);
  } else {
    await saveSecret(id, data);
  }

  const urlEl = document.createElement('div');
  urlEl.className = 'reveal-url';
  urlEl.innerHTML = `<a href="${data.url}" target="_blank" rel="noopener noreferrer">${data.url}</a>`;
  
  app.innerHTML = `
    <div class="center">
      <p style="font-weight:700; margin-bottom:12px; font-size:18px;">${t('brokenTitle')}</p>
      ${urlEl.outerHTML}
      <button class="seal-btn" id="goBtn">${t('goBtn')}</button>
      <p class="status-note">${data.oneTime ? t('goneNote') : ''}</p>
    </div>
  `;

  document.getElementById('goBtn').addEventListener('click', () => {
    window.open(data.url, '_blank');
  });
}

// Language switching
document.addEventListener('DOMContentLoaded', () => {
  if (location.hash) {
    const code = location.hash.slice(1);
    renderRevealView(code);
  } else {
    renderCreateForm();
  }

  document.getElementById('langToggle').addEventListener('click', () => {
    LANG = LANG === 'fa' ? 'en' : 'fa';
    applyShellLang();
  });

  window.addEventListener('hashchange', () => {
    const code = location.hash.slice(1);
    if (code) {
      renderRevealView(code);
    } else {
      renderCreateForm();
    }
  });
});

function sealSvg() {
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1C6.48 1 2 5.48 2 11c0 5.52 4.48 10 10 10s10-4.48 10-10-4.48-10-10-10zm-2 15l-5-5 1.41-1.41L10 13.17l7.59-7.59L19 7l-9 9z"/></svg>`;
}
